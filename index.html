<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Posture Correction Program – 8 Week Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #F3F0EA;
      --bg-card:     #FFFFFF;
      --bg-muted:    #EAE6DF;
      --border:      #DED9D0;
      --sage:        #6B9B6E;
      --sage-light:  #A4C4A6;
      --sage-dark:   #4A7A4D;
      --amber:       #C4895A;
      --amber-light: #E8C4A0;
      --red-soft:    #C26060;
      --text:        #2A2A2A;
      --text-mid:    #666666;
      --text-light:  #999999;
      --shadow:      0 2px 12px rgba(0,0,0,0.07);
      --shadow-sm:   0 1px 4px rgba(0,0,0,0.05);
      --radius:      14px;
      --radius-sm:   8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.5;
    }

    /* ===== HEADER ===== */
    .app-header {
      background: linear-gradient(150deg, #4A7A4D 0%, #6B9B6E 60%, #8AB58D 100%);
      padding: 18px 18px 14px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .app-title {
      font-family: 'Lora', serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }
    .app-tagline { font-size: 0.72rem; opacity: 0.75; font-weight: 400; }
    .header-streak {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(255,255,255,0.18); border-radius: 12px;
      padding: 6px 10px; min-width: 52px;
    }
    .streak-num { font-family: 'Lora', serif; font-size: 1.4rem; font-weight: 700; line-height: 1; }
    .streak-lbl { font-size: 0.6rem; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px; }

    /* ===== WEEK TABS ===== */
    .week-tabs-wrap { background: #3E6940; overflow-x: auto; scrollbar-width: none; }
    .week-tabs-wrap::-webkit-scrollbar { display: none; }
    .week-tabs { display: flex; padding: 10px 12px 10px; gap: 6px; width: max-content; }
    .week-tab {
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.65);
      border: none; border-radius: 30px; padding: 5px 13px;
      font-family: 'DM Sans', sans-serif; font-size: 0.76rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all 0.18s ease;
    }
    .week-tab.active { background: #fff; color: #3E6940; }

    /* ===== DAY TABS ===== */
    .day-tabs-wrap { background: var(--bg-muted); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    .day-tabs-wrap::-webkit-scrollbar { display: none; }
    .day-tabs { display: flex; padding: 10px 12px; gap: 7px; }
    .day-tab {
      background: var(--bg-card); color: var(--text-mid);
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: 5px 10px; font-family: 'DM Sans', sans-serif;
      font-size: 0.73rem; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all 0.15s; min-width: 48px; text-align: center;
    }
    .day-tab.active { background: var(--sage); color: #fff; border-color: var(--sage); }
    .day-tab.done-flag { border-color: var(--sage-light); }
    .day-tab.done-flag::after { content: ' ✓'; color: var(--sage); font-size: 0.65rem; }
    .day-tab.active.done-flag::after { color: rgba(255,255,255,0.8); }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg-card); border-top: 1px solid var(--border);
      display: flex; z-index: 100; box-shadow: 0 -2px 12px rgba(0,0,0,0.07);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 9px 4px 11px; border: none; background: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.62rem; color: var(--text-light);
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.15s;
      gap: 3px;
    }
    .nav-btn.active { color: var(--sage); }
    .nav-icon { font-size: 1.2rem; line-height: 1; }
    .nav-btn.active .nav-icon { filter: saturate(1.5); }

    /* ===== PAGES ===== */
    .page { display: none; }
    .page.active { display: block; }

    /* ===== MAIN CONTENT ===== */
    .main { padding: 14px 14px 110px; max-width: 480px; margin: 0 auto; }

    /* ===== WEEK INFO BAR ===== */
    .week-info {
      background: linear-gradient(120deg, var(--amber) 0%, #D4A070 100%);
      border-radius: var(--radius); padding: 13px 16px; margin-bottom: 13px; color: #fff;
    }
    .week-info h2 { font-family: 'Lora', serif; font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
    .week-info p { font-size: 0.73rem; opacity: 0.85; }

    /* ===== STATS ROW ===== */
    .stats-row { display: flex; gap: 9px; margin-bottom: 13px; }
    .stat-card { flex: 1; background: var(--bg-card); border-radius: var(--radius-sm); padding: 11px 8px; text-align: center; box-shadow: var(--shadow-sm); }
    .stat-num { font-family: 'Lora', serif; font-size: 1.6rem; font-weight: 700; color: var(--sage-dark); line-height: 1; }
    .stat-lbl { font-size: 0.65rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 3px; }

    /* ===== PROGRESS BARS ===== */
    .progress-card { background: var(--bg-card); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 13px; box-shadow: var(--shadow-sm); }
    .prog-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
    .prog-lbl { font-size: 0.73rem; font-weight: 600; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.05em; }
    .prog-pct { font-family: 'Lora', serif; font-size: 1.05rem; font-weight: 700; color: var(--sage-dark); }
    .prog-bar-bg { background: var(--bg-muted); border-radius: 99px; height: 7px; overflow: hidden; }
    .prog-bar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sage-light), var(--sage-dark)); transition: width 0.45s ease; }
    .prog-divider { height: 10px; }

    /* ===== SECTION CARDS ===== */
    .section-card { background: var(--bg-card); border-radius: var(--radius); padding: 15px 14px; margin-bottom: 13px; box-shadow: var(--shadow); }
    .section-head { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 12px; }
    .section-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .icon-green  { background: #E4F2E4; }
    .icon-blue   { background: #E4EEF7; }
    .icon-purple { background: #EDE4F4; }
    .icon-yellow { background: #F7F2E0; }
    .icon-orange { background: #FDF0E4; }
    .section-title { font-family: 'Lora', serif; font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .section-sub { font-size: 0.7rem; color: var(--text-light); font-weight: 400; margin-top: 1px; }

    /* ===== EXERCISE ITEMS ===== */
    .exercise { border: 1.5px solid var(--border); border-radius: 11px; padding: 11px 12px; margin-bottom: 9px; transition: border-color 0.2s, background 0.2s; }
    .exercise.ex-done { border-color: var(--sage-light); background: #F0F8F0; }
    .ex-name { font-weight: 600; font-size: 0.85rem; color: var(--text); }
    .ex-meta { font-size: 0.72rem; color: var(--amber); font-weight: 600; margin: 2px 0 9px; }
    .sets-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .set-btn {
      width: 38px; height: 38px; border-radius: 10px;
      border: 2px solid var(--border); background: var(--bg-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 700; color: var(--text-mid);
      transition: all 0.15s; font-family: 'DM Sans', sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    .set-btn.set-done { background: var(--sage); border-color: var(--sage); color: #fff; }
    .set-btn:active { transform: scale(0.88); }
    .sets-hint { font-size: 0.66rem; color: var(--text-light); }

    /* ===== HABITS ===== */
    .habit-list { margin: 0; }
    .habit-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--bg-muted); cursor: pointer; user-select: none; -webkit-user-select: none; }
    .habit-row:last-child { border-bottom: none; }
    .habit-box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border); background: var(--bg-card); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0; transition: all 0.15s; color: #fff; font-weight: 700; }
    .habit-box.habit-checked { background: var(--sage); border-color: var(--sage); font-size: 0.75rem; }
    .habit-box.habit-checked::after { content: '✓'; }
    .habit-text { font-size: 0.82rem; color: var(--text); }

    /* ===== RATING ===== */
    .rating-row { display: flex; gap: 8px; justify-content: center; padding: 6px 0 4px; }
    .rating-btn {
      width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--bg-muted); cursor: pointer; font-size: 1.25rem;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
    }
    .rating-btn.selected { border-color: var(--amber); background: #FDF0E4; transform: scale(1.12); }
    .rating-label { font-size: 0.72rem; color: var(--text-light); text-align: center; margin-top: 5px; }

    /* ===== NOTES ===== */
    .notes-label { font-size: 0.75rem; font-weight: 600; color: var(--text-mid); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .notes-area {
      width: 100%; border: 1.5px solid var(--border); border-radius: 11px;
      padding: 11px 12px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      color: var(--text); background: var(--bg-muted); resize: none; min-height: 90px;
      outline: none; transition: border-color 0.2s, background 0.2s; line-height: 1.5;
    }
    .notes-area:focus { border-color: var(--sage); background: var(--bg-card); }
    .notes-area::placeholder { color: var(--text-light); }

    /* ===== STATUS MSG ===== */
    .status-msg { border-radius: 11px; padding: 13px 14px; margin-bottom: 13px; font-size: 0.82rem; font-weight: 500; line-height: 1.5; display: none; }
    .status-msg.msg-complete { display: block; background: #E6F3E6; color: #3A6B3C; border: 1.5px solid #A4C4A6; }
    .status-msg.msg-incomplete { display: block; background: #FDF0E8; color: #8B4513; border: 1.5px solid #E0B895; }
    .status-emoji { font-size: 1.1rem; margin-right: 6px; }

    /* ===== ACTION BUTTONS ===== */
    .action-row { display: flex; gap: 8px; margin-bottom: 13px; }
    .btn { flex: 1; padding: 10px 8px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.77rem; font-weight: 600; cursor: pointer; transition: transform 0.12s, opacity 0.12s; text-align: center; }
    .btn:active { transform: scale(0.95); opacity: 0.85; }
    .btn-sage    { background: var(--sage); color: #fff; }
    .btn-outline { background: #fff; color: var(--text-mid); border: 1.5px solid var(--border); }
    .btn-danger  { background: #fff; color: var(--red-soft); border: 1.5px solid #E8BABA; }
    .btn-amber   { background: var(--amber); color: #fff; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 72px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #2A2A2A; color: #fff; padding: 9px 20px;
      border-radius: 30px; font-size: 0.75rem; font-weight: 500;
      opacity: 0; transition: all 0.3s ease; z-index: 1000;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== TIMER FLOATING ===== */
    .timer-fab {
      position: fixed; bottom: 78px; right: 16px;
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--sage-dark); color: #fff; border: none;
      font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 16px rgba(74,122,77,0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 99; transition: transform 0.15s, background 0.15s;
    }
    .timer-fab:active { transform: scale(0.92); }
    .timer-fab.running { background: var(--red-soft); }
    .timer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .timer-overlay.open { opacity: 1; pointer-events: all; }
    .timer-box {
      background: var(--bg-card); border-radius: 22px; padding: 28px 24px;
      text-align: center; width: 280px; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .timer-display {
      font-family: 'Lora', serif; font-size: 3.5rem; font-weight: 700;
      color: var(--sage-dark); line-height: 1; margin: 12px 0 20px;
    }
    .timer-presets { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
    .timer-preset {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--bg-muted); font-size: 0.75rem; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif; color: var(--text-mid);
      transition: all 0.15s;
    }
    .timer-preset.sel { background: var(--sage); color: #fff; border-color: var(--sage); }
    .timer-btns { display: flex; gap: 10px; justify-content: center; }
    .timer-btn {
      padding: 10px 22px; border-radius: 11px; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.12s;
    }
    .timer-btn:active { opacity: 0.8; }
    .timer-close { font-size: 0.72rem; color: var(--text-light); margin-top: 14px; cursor: pointer; }

    /* ===== CALENDAR PAGE ===== */
    .cal-header { padding: 16px 14px 0; max-width: 480px; margin: 0 auto; }
    .cal-title { font-family: 'Lora', serif; font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .cal-sub { font-size: 0.73rem; color: var(--text-light); margin-bottom: 14px; }
    .cal-start-row {
      background: var(--bg-card); border-radius: var(--radius-sm); padding: 11px 13px;
      margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    .cal-start-lbl { font-size: 0.78rem; font-weight: 600; color: var(--text-mid); }
    .cal-date-input {
      border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 9px;
      font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--text);
      background: var(--bg-muted); outline: none;
    }
    .cal-grid-wrap { padding: 0 14px 110px; max-width: 480px; margin: 0 auto; }
    .cal-week-block { margin-bottom: 16px; }
    .cal-week-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-mid); margin-bottom: 7px;
    }
    .cal-days-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-day {
      aspect-ratio: 1; border-radius: 9px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
      font-size: 0.65rem; font-weight: 600; transition: transform 0.12s;
      border: 1.5px solid transparent; position: relative; gap: 2px;
    }
    .cal-day:active { transform: scale(0.9); }
    .cal-day-num { font-family: 'Lora', serif; font-size: 0.85rem; font-weight: 700; line-height: 1; }
    .cal-day-date { font-size: 0.55rem; font-weight: 500; opacity: 0.7; }
    .cal-day.not-started { background: var(--bg-muted); border-color: var(--border); color: var(--text-light); }
    .cal-day.partial     { background: #FDF3EA; border-color: #E8C4A0; color: var(--amber); }
    .cal-day.done        { background: #E4F2E4; border-color: var(--sage-light); color: var(--sage-dark); }
    .cal-day.today-mark  { box-shadow: 0 0 0 2px var(--sage-dark); }
    .cal-day.current-sel { box-shadow: 0 0 0 2.5px var(--amber); }
    .cal-pct { font-size: 0.52rem; font-weight: 700; }

    /* ===== SUMMARY PAGE ===== */
    .sum-wrap { padding: 14px 14px 110px; max-width: 480px; margin: 0 auto; }
    .sum-hero {
      background: linear-gradient(135deg, #4A7A4D 0%, #6B9B6E 100%);
      border-radius: var(--radius); padding: 22px 18px; margin-bottom: 16px; color: #fff; text-align: center;
    }
    .sum-big { font-family: 'Lora', serif; font-size: 3rem; font-weight: 700; line-height: 1; }
    .sum-big-lbl { font-size: 0.75rem; opacity: 0.8; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .sum-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }
    .sum-stat-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; box-shadow: var(--shadow-sm); }
    .sum-stat-num { font-family: 'Lora', serif; font-size: 1.8rem; font-weight: 700; color: var(--sage-dark); line-height: 1; }
    .sum-stat-lbl { font-size: 0.65rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }
    .week-progress-list { background: var(--bg-card); border-radius: var(--radius); padding: 15px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .week-prog-item { margin-bottom: 12px; }
    .week-prog-item:last-child { margin-bottom: 0; }
    .week-prog-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
    .week-prog-name { font-size: 0.75rem; font-weight: 600; color: var(--text-mid); }
    .week-prog-pct { font-family: 'Lora', serif; font-size: 0.9rem; font-weight: 700; color: var(--sage-dark); }
    .week-rating-avg { font-size: 0.7rem; color: var(--text-light); margin-left: 6px; }


    /* ===== ESTIMASI WAKTU ===== */
    .est-time-bar {
      background: linear-gradient(120deg, #E8F4E8 0%, #F0F8F0 100%);
      border: 1.5px solid var(--sage-light); border-radius: var(--radius-sm);
      padding: 10px 14px; margin-bottom: 13px;
      display: flex; align-items: center; gap: 10px;
    }
    .est-time-icon { font-size: 1.1rem; }
    .est-time-text { flex: 1; }
    .est-time-label { font-size: 0.7rem; color: var(--sage-dark); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .est-time-value { font-family: 'Lora', serif; font-size: 1rem; font-weight: 700; color: var(--sage-dark); }
    .est-time-detail { font-size: 0.68rem; color: var(--text-light); margin-top: 1px; }

    /* ===== GRAFIK TREND (Canvas) ===== */
    .chart-card { background: var(--bg-card); border-radius: var(--radius); padding: 15px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .chart-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .chart-title { font-family: 'Lora', serif; font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .chart-legend { display: flex; gap: 12px; }
    .chart-legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.62rem; color: var(--text-mid); font-weight: 600; }
    .chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .chart-wrap { position: relative; width: 100%; }
    canvas.trend-chart { width: 100% !important; height: 160px !important; display: block; }

    /* ===== PERBANDINGAN MINGGU ===== */
    .week-compare-card { background: var(--bg-card); border-radius: var(--radius); padding: 15px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .compare-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bg-muted); }
    .compare-row:last-child { border-bottom: none; padding-bottom: 0; }
    .compare-week-name { font-size: 0.73rem; font-weight: 600; color: var(--text-mid); min-width: 72px; }
    .compare-bar-wrap { flex: 1; position: relative; }
    .compare-bar-bg { background: var(--bg-muted); border-radius: 99px; height: 8px; overflow: visible; position: relative; }
    .compare-bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; position: relative; }
    .compare-bar-fill.better { background: linear-gradient(90deg, var(--sage-light), var(--sage-dark)); }
    .compare-bar-fill.worse  { background: linear-gradient(90deg, #E8C4A0, var(--amber)); }
    .compare-bar-fill.same   { background: var(--sage-light); }
    .compare-delta { font-size: 0.68rem; font-weight: 700; min-width: 38px; text-align: right; }
    .compare-delta.up   { color: var(--sage-dark); }
    .compare-delta.down { color: var(--amber); }
    .compare-delta.eq   { color: var(--text-light); }
    .compare-pct { font-family: 'Lora', serif; font-size: 0.82rem; font-weight: 700; color: var(--text); min-width: 36px; text-align: right; }

/* ============================================================
   FITUR 4: ESTIMASI WAKTU LATIHAN
============================================================ */
// Asumsi: setiap set ~40 detik + 45 detik istirahat antar set = ~85 detik/set
// Stretch/hold: 30 detik per set
// Antar latihan: 20 detik
const SEC_PER_STRENGTH_SET = 85; // eksekusi + istirahat
const SEC_PER_STRETCH_SET  = 50; // hold + transisi

function calcEstimatedTime(w, d) {
  const wData = WEEKS[w];
  let totalSec = 0;

  wData.section1.forEach(ex => {
    const isStretch = ex.detail.includes('detik');
    const secPerSet = isStretch ? SEC_PER_STRETCH_SET : SEC_PER_STRENGTH_SET;
    totalSec += ex.sets * secPerSet + 20; // +20 transisi antar latihan
  });

  if (isWorkoutDay(d)) {
    wData.section2.forEach(ex => {
      totalSec += ex.sets * SEC_PER_STRENGTH_SET + 20;
    });
  }

  const totalMin = Math.round(totalSec / 60);
  const s1Only = !isWorkoutDay(d);
  return { totalMin, s1Only };
}

function renderEstTime(w, d) {
  const { totalMin, s1Only } = calcEstimatedTime(w, d);
  const rangeMin = Math.max(5, totalMin - 3);
  const rangeMax = totalMin + 5;
  const label = s1Only ? 'Reset postur saja' : 'Termasuk Latihan Utama';
  return `<div class="est-time-bar anim">

function renderTrendChart() {
  // Kumpulkan data progress semua 56 hari
  const points = [];
  for (let w = 0; w < 8; w++) {
    for (let d = 0; d < 7; d++) {
      const pct = calcDayProgress(w, d);
      points.push({ w, d, pct, label: 'M' + (w+1) + 'H' + (d+1) });
    }
  }

  // Temukan hari terakhir yang punya data (>0)
  let lastActive = -1;
  points.forEach((p, i) => { if (p.pct > 0) lastActive = i; });
  const visible = lastActive < 13 ? points.slice(0, Math.max(14, lastActive + 4)) : points.slice(0, lastActive + 4);
  const show = visible.slice(-28); // maks 28 hari terakhir yang relevan

  const canvasId = 'trendCanvas';
  const html = `<div class="chart-card anim">
    <div class="chart-title-row">
      <span class="chart-title">📈 Trend Progress Harian</span>
      <div class="chart-legend">
        <div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--sage-dark)"></div>Progress</div>
        <div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--amber);"></div>Target</div>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="${canvasId}" class="trend-chart" width="400" height="160"></canvas>
    </div>
  </div>`;

  return { html, show };
}

function drawTrendChart(show) {
  const canvas = document.getElementById('trendCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth * window.devicePixelRatio || 400;
  const H = 160 * (window.devicePixelRatio || 1);
  canvas.width  = W;
  canvas.height = H;
  const dpr = window.devicePixelRatio || 1;
  ctx.scale(dpr, dpr);
  const cw = canvas.offsetWidth;
  const ch = 160;

  const padL = 28, padR = 12, padT = 12, padB = 32;
  const gw = cw - padL - padR;
  const gh = ch - padT - padB;
  const n  = show.length;

  // Grid lines
  ctx.strokeStyle = '#EAE6DF';
  ctx.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = padT + gh - (v / 100) * gh;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + gw, y); ctx.stroke();
    ctx.fillStyle = '#999';
    ctx.font = `${9 * dpr / dpr}px DM Sans, sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText(v + '%', padL - 4, y + 3);
  });

  if (n === 0) return;

  const xPos = i => padL + (i / (n - 1 || 1)) * gw;
  const yPos = v => padT + gh - (v / 100) * gh;

  // Target line (100%)
  ctx.strokeStyle = 'rgba(196,137,90,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL + gw, padT); ctx.stroke();
  ctx.setLineDash([]);

  // Area fill
  const grad = ctx.createLinearGradient(0, padT, 0, padT + gh);
  grad.addColorStop(0, 'rgba(107,155,110,0.28)');
  grad.addColorStop(1, 'rgba(107,155,110,0.02)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(xPos(0), yPos(show[0].pct));
  for (let i = 1; i < n; i++) {
    const x0 = xPos(i-1), y0 = yPos(show[i-1].pct);
    const x1 = xPos(i),   y1 = yPos(show[i].pct);
    const cpx = (x0 + x1) / 2;
    ctx.bezierCurveTo(cpx, y0, cpx, y1, x1, y1);
  }
  ctx.lineTo(xPos(n-1), padT + gh);
  ctx.lineTo(xPos(0), padT + gh);
  ctx.closePath(); ctx.fill();

  // Line
  ctx.strokeStyle = '#4A7A4D';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(xPos(0), yPos(show[0].pct));
  for (let i = 1; i < n; i++) {
    const x0 = xPos(i-1), y0 = yPos(show[i-1].pct);
    const x1 = xPos(i),   y1 = yPos(show[i].pct);
    const cpx = (x0 + x1) / 2;
    ctx.bezierCurveTo(cpx, y0, cpx, y1, x1, y1);
  }
  ctx.stroke();

  // Dots + labels
  show.forEach((p, i) => {
    const x = xPos(i), y = yPos(p.pct);
    const isLast = i === n - 1;
    // Hanya gambar dot jika ada data atau terakhir
    if (p.pct > 0 || i === 0) {
      ctx.beginPath();
      ctx.arc(x, y, isLast ? 4 : 3, 0, Math.PI * 2);
      ctx.fillStyle = p.pct === 100 ? '#4A7A4D' : (p.pct > 0 ? '#6B9B6E' : '#DED9D0');
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // Label sumbu X: tampilkan label Minggu di hari pertama tiap minggu
    if (p.d === 0) {
      ctx.fillStyle = '#999';
      ctx.font = '8px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('M' + (p.w + 1), x, ch - 6);
    }
  });

  // Tooltip titik terakhir aktif
  const lastDot = [...show].reverse().find(p => p.pct > 0);
  if (lastDot) {
    const idx = show.indexOf(lastDot);
    const x = xPos(idx), y = yPos(lastDot.pct);
    ctx.fillStyle = '#4A7A4D';
    ctx.font = 'bold 9px DM Sans, sans-serif';
    ctx.textAlign = x > cw - 40 ? 'right' : 'center';
    ctx.fillText(lastDot.pct + '%', x, y - 8);
  }
}


/* ============================================================
   FITUR 6: PERBANDINGAN MINGGU KE MINGGU
============================================================ */
function renderWeekComparison() {
  const weekData = WEEKS.map((_, wi) => ({
    pct: calcWeekProgress(wi),
    title: 'Minggu ' + (wi + 1),
  }));

  // Temukan minggu aktif (ada data)
  const activeWeeks = weekData.filter(w => w.pct > 0);
  if (activeWeeks.length < 2) {
    return `<div class="week-compare-card anim">
      <div class="section-head" style="margin-bottom:8px;">
        <div class="section-icon icon-purple">🔄</div>
        <div><div class="section-title">Perbandingan Minggu</div><div class="section-sub">Tersedia setelah 2 minggu aktif</div></div>
      </div>
      <p style="font-size:0.78rem;color:var(--text-light);text-align:center;padding:12px 0;">
        Selesaikan setidaknya 2 minggu untuk melihat perbandingan.
      </p>
    </div>`;
  }

  // Cari minggu terbaik & terburuk
  let bestWi = 0, worstWi = 0;
  weekData.forEach((w, i) => {
    if (w.pct > weekData[bestWi].pct) bestWi = i;
    if (w.pct < weekData[worstWi].pct && w.pct > 0) worstWi = i;
  });

  // Kalimat insight otomatis
  let insight = '';
  const lastActiveIdx = weekData.reduce((acc, w, i) => w.pct > 0 ? i : acc, 0);
  if (lastActiveIdx > 0) {
    const cur = weekData[lastActiveIdx].pct;
    const prev = weekData[lastActiveIdx - 1].pct;
    const diff = cur - prev;
    if (diff > 5) insight = `Minggu ${lastActiveIdx+1} meningkat <span class="compare-highlight">+${diff}%</span> dari minggu sebelumnya. Pertahankan! 🔥`;
    else if (diff < -5) insight = `Minggu ${lastActiveIdx+1} turun <span class="compare-highlight neg">${diff}%</span> dari minggu lalu. Evaluasi konsistensimu.`;
    else if (diff >= 0) insight = `Konsistensi stabil antara Minggu ${lastActiveIdx} dan ${lastActiveIdx+1}. Bagus! 👍`;
    else insight = `Progress minggu ini sedikit menurun. Kamu masih bisa kejar! 💪`;
  }

  // Baris perbandingan
  const rows = weekData.map((w, i) => {
    if (w.pct === 0 && i > lastActiveIdx) return '';
    const prev = i > 0 ? weekData[i-1].pct : null;
    const delta = prev !== null ? w.pct - prev : null;
    let deltaHtml = '', fillClass = 'same';
    if (delta !== null && weekData[i-1].pct > 0) {
      if (delta > 0)      { deltaHtml = `<span class="compare-delta up">▲${delta}%</span>`; fillClass = 'better'; }
      else if (delta < 0) { deltaHtml = `<span class="compare-delta down">▼${Math.abs(delta)}%</span>`; fillClass = 'worse'; }
      else                { deltaHtml = `<span class="compare-delta eq">—</span>`; }
    }
    const isBest  = i === bestWi && w.pct > 0;
    const nameExtra = isBest ? ' 🏆' : '';
    return `<div class="compare-row">
      <span class="compare-week-name">${w.title}${nameExtra}</span>
      <div class="compare-bar-wrap">
        <div class="compare-bar-bg">
          <div class="compare-bar-fill ${fillClass}" style="width:${w.pct}%"></div>
        </div>
      </div>
      <span class="compare-pct">${w.pct}%</span>
      ${deltaHtml}
    </div>`;
  }).join('');

  return `<div class="week-compare-card anim">
    <div class="section-head" style="margin-bottom:4px;">
      <div class="section-icon icon-purple">🔄</div>
      <div><div class="section-title">Perbandingan Minggu ke Minggu</div><div class="section-sub">Progresmu dari minggu ke minggu</div></div>
    </div>
    ${rows}
    ${insight ? `<div class="compare-note">${insight}</div>` : ''}
  </div>`;
}

}
function saveAll(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function dayKey(w, d) { return `w${w}_d${d}`; }

function getDayData(w, d) {
  const all = loadAll();
  const key = dayKey(w, d);
  if (!all[key]) {
    const wData = WEEKS[w];
    const s1Sets = wData.section1.map(e => Array(e.sets).fill(false));
    const s2Sets = wData.section2.map(e => Array(e.sets).fill(false));
    all[key] = { s1: s1Sets, s2: s2Sets, habits: Array(HABITS.length).fill(false), notes: "", rating: 0 };
    saveAll(all);
  }
  // ensure rating field exists in old data
  if (!all[key].rating) { all[key].rating = 0; saveAll(all); }
  return all[key];
}

function setDayData(w, d, data) {
  const all = loadAll(); all[dayKey(w, d)] = data; saveAll(all);
}

function getStartDate() { return loadAll().startDate || null; }
function setStartDate(val) { const all = loadAll(); all.startDate = val; saveAll(all); }

/* ============================================================
   CALCULATIONS
============================================================ */
function calcDayProgress(w, d) {
  const data = getDayData(w, d);
  const wData = WEEKS[w];
  let total = 0, done = 0;
  wData.section1.forEach((e, i) => { total += e.sets; done += data.s1[i].filter(Boolean).length; });
  // Hanya hitung section2 jika hari ini adalah hari latihan utama
  if (isWorkoutDay(d)) {
    wData.section2.forEach((e, i) => { total += e.sets; done += data.s2[i].filter(Boolean).length; });
  }
  total += HABITS.length;
  done  += data.habits.filter(Boolean).length;
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

function calcWeekProgress(w) {
  let total = 0;
  for (let d = 0; d < 7; d++) total += calcDayProgress(w, d);
  return Math.round(total / 7);
}

function isDayDone(w, d) { return calcDayProgress(w, d) === 100; }

function calcOverallProgress() {
  let total = 0;
  for (let w = 0; w < 8; w++) for (let d = 0; d < 7; d++) total += calcDayProgress(w, d);
  return Math.round(total / 56);
}

function calcStreak() {
  // Count consecutive completed days backwards from the last done day
  let streak = 0;
  for (let w = 7; w >= 0; w--) {
    for (let d = 6; d >= 0; d--) {
      if (isDayDone(w, d)) streak++;
      else if (streak > 0) return streak; // broken
    }
  }
  return streak;
}

function calcBestStreak() {
  let best = 0, cur = 0;
  for (let w = 0; w < 8; w++) {
    for (let d = 0; d < 7; d++) {
      if (isDayDone(w, d)) { cur++; if (cur > best) best = cur; }
      else cur = 0;
    }
  }
  return best;
}

function calcTotalSetsDone() {
  let done = 0;
  for (let w = 0; w < 8; w++) {
    for (let d = 0; d < 7; d++) {
      const data = getDayData(w, d);
      data.s1.forEach(sets => { done += sets.filter(Boolean).length; });
      data.s2.forEach(sets => { done += sets.filter(Boolean).length; });
    }
  }
  return done;
}

function calcDaysStarted() {
  let count = 0;
  for (let w = 0; w < 8; w++)
    for (let d = 0; d < 7; d++)
      if (calcDayProgress(w, d) > 0) count++;
  return count;
}

function getDateForDay(w, d) {
  const start = getStartDate();
  if (!start) return null;
  const base = new Date(start);
  base.setDate(base.getDate() + (w * 7 + d));
  return base;
}

function isToday(w, d) {
  const dt = getDateForDay(w, d);
  if (!dt) return false;
  const now = new Date();
  return dt.toDateString() === now.toDateString();
}

function formatShortDate(date) {
  if (!date) return '';
  return `${date.getDate()}/${date.getMonth()+1}`;
}

function renderCalendar() {
  const start = getStartDate();
  document.getElementById('startDateInput').value = start || '';

  const grid = document.getElementById('calGrid');
  grid.innerHTML = WEEKS.map((wData, wi) => {
    const days = Array.from({length:7}, (_, di) => {
      const pct = calcDayProgress(wi, di);
      const done = pct === 100;
      const partial = pct > 0 && pct < 100;
      const dateObj = getDateForDay(wi, di);
      const todayMark = isToday(wi, di);
      const isCurrent = (wi === currentWeek && di === currentDay);
      let cls = 'not-started';
      if (done) cls = 'done';
      else if (partial) cls = 'partial';
      if (todayMark) cls += ' today-mark';
      if (isCurrent) cls += ' current-sel';
      const dateLabel = dateObj ? formatShortDate(dateObj) : '';
      return `<div class="cal-day ${cls}" onclick="calSelectDay(${wi},${di})" title="Minggu ${wi+1} Hari ${di+1}${todayMark?' · Hari ini':''}">
        <div class="cal-day-num">${di+1}</div>
        ${dateLabel ? `<div class="cal-day-date">${dateLabel}</div>` : ''}
        ${pct > 0 ? `<div class="cal-pct">${pct}%</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="cal-week-block">
      <div class="cal-week-label">${wData.title}</div>
      <div class="cal-days-row">${days}</div>
    </div>`;
  }).join('');
}

function getMotivationTip(overall, streak) {
  if (overall === 0) return "Mulai perjalananmu hari ini. Satu langkah kecil lebih baik dari tidak sama sekali. 🌱";
  if (overall < 20) return `Awal yang bagus! Konsistensi di awal program adalah kunci segalanya. Kamu sudah memulai — itu yang paling sulit. 💪`;
  if (streak >= 7) return `🔥 ${streak} hari berturut-turut! Luar biasa. Kebiasaan terbentuk setelah 21 hari — kamu sedang di jalur yang benar.`;
  if (streak === 0 && overall > 0) return "Setiap pelari terbaik pernah jatuh. Yang membedakan adalah bangkit dan lanjutkan. 🏃";
  if (overall >= 80) return "Hampir selesai! Di sini banyak orang menyerah karena merasa sudah cukup baik. Tapi kamu tahu — postur ideal butuh komitmen penuh. 🎯";
  return "Pertahankan ritme ini. Perubahan postur butuh waktu, tapi tubuhmu pasti merasakannya. Terus bergerak! 🧘";
}

/* ============================================================
   USER INTERACTIONS
============================================================ */
function selectWeek(idx) { currentWeek = idx; currentDay = 0; renderAll(); }
function selectDay(idx)  { currentDay = idx; renderAll(); }

function renderAll() {
  renderStreak();
  renderWeekTabs();
  renderDayTabs();
  renderMain();
}

function toggleSet(section, exIdx, setIdx) {
  const w = currentWeek, d = currentDay;
  const data = getDayData(w, d);
  const sets = section === 1 ? data.s1[exIdx] : data.s2[exIdx];

  // Jika ingin mencentang, pastikan semua set sebelumnya sudah selesai
  if (!sets[setIdx]) {
    for (let i = 0; i < setIdx; i++) {
      if (!sets[i]) {
        showToast('⚠️ Selesaikan S' + (i + 1) + ' terlebih dahulu');
        return;
      }
    }
  }

  sets[setIdx] = !sets[setIdx];

  // Jika uncheck, otomatis uncheck semua set sesudahnya
  if (!sets[setIdx]) {
    for (let i = setIdx + 1; i < sets.length; i++) sets[i] = false;
  }

  setDayData(w, d, data);
  showToast('Tersimpan ✓');
  renderAll();
}

function toggleHabit(idx) {
  const w = currentWeek, d = currentDay;
  const data = getDayData(w, d);
  data.habits[idx] = !data.habits[idx];
  setDayData(w, d, data);
  showToast('Kebiasaan diperbarui ✓');
  renderAll();
}

function setRating(val) {
  const w = currentWeek, d = currentDay;
  const data = getDayData(w, d);
  data.rating = (data.rating === val) ? 0 : val; // toggle off
  setDayData(w, d, data);
  showToast('Rating disimpan ✓');
  renderAll();
}

let noteTimer = null;
function saveNotes(val) {
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    const w = currentWeek, d = currentDay;
    const data = getDayData(w, d);
    data.notes = val;
    setDayData(w, d, data);
    showToast('Catatan tersimpan ✓');
  }, 700);
}

function markAllToday() {
  const w = currentWeek, d = currentDay;
  const wData = WEEKS[w];
  const data  = getDayData(w, d);
  data.s1     = wData.section1.map(e => Array(e.sets).fill(true));
  if (isWorkoutDay(d)) {
    data.s2   = wData.section2.map(e => Array(e.sets).fill(true));
  }
  data.habits = Array(HABITS.length).fill(true);
  setDayData(w, d, data);
  showToast('🎉 Semua latihan hari ini selesai!');
  renderAll();
}

function resetToday() {
  if (!confirm('Reset progress hari ini?')) return;
  const w = currentWeek, d = currentDay;
  const wData = WEEKS[w];
  const resetData = {
    s1: wData.section1.map(e => Array(e.sets).fill(false)),
    s2: isWorkoutDay(d) ? wData.section2.map(e => Array(e.sets).fill(false)) : getDayData(w, d).s2,
    habits: Array(HABITS.length).fill(false),
    notes: getDayData(w, d).notes,
    rating: 0,
  };
  setDayData(w, d, resetData);
  showToast('Progress hari ini direset');
  renderAll();
}

function resetAll() {
  if (!confirm('Reset SELURUH program? Semua data akan dihapus!')) return;
  if (!confirm('Yakin? Ini tidak bisa dibatalkan.')) return;
  localStorage.removeItem(STORAGE_KEY);
  currentWeek = 0; currentDay = 0;
  showToast('Program direset dari awal');
  renderAll();
}

/* ============================================================
   TIMER
============================================================ */
let timerSeconds = 60;
let timerRunning = false;
let timerInterval = null;
let selectedPreset = 60;

function selectPreset(secs) {
  selectedPreset = secs;
  timerSeconds = secs;
  if (!timerRunning) updateTimerDisplay();
  ['30','45','60','90'].forEach(p => {
    document.getElementById('pre'+p).classList.toggle('sel', parseInt(p) === secs);
  });
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  document.getElementById('timerDisplay').textContent =
    m > 0 ? `${m}:${s.toString().padStart(2,'0')}` : `${timerSeconds}`;
  document.getElementById('timerDisplay').classList.toggle('pulsing', timerRunning);
}

function startTimer() {
  if (timerRunning) return;
  if (timerSeconds <= 0) { timerSeconds = selectedPreset; }
  timerRunning = true;
  document.getElementById('timerFab').classList.add('running');
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timerFab').classList.remove('running');
      showToast('⏰ Istirahat selesai! Lanjutkan set berikutnya.');
      // vibrate if supported
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
      timerSeconds = selectedPreset;
      updateTimerDisplay();
    }
  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerFab').classList.remove('running');
  timerSeconds = selectedPreset;
  updateTimerDisplay();
}

function openTimer() {
  document.getElementById('timerOverlay').classList.add('open');
  updateTimerDisplay();
}

function closeTimer() {
  document.getElementById('timerOverlay').classList.remove('open');
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ============================================================
   INIT
============================================================ */
function init() {
  // Auto-detect today's week/day if start date is set
  const start = getStartDate();
  if (start) {
    const startMs = new Date(start).getTime();
    const nowMs   = new Date().setHours(0,0,0,0);
    const diff    = Math.floor((nowMs - startMs) / 86400000);
    if (diff >= 0 && diff < 56) {
      currentWeek = Math.floor(diff / 7);
      currentDay  = diff % 7;
    }
  }
  renderAll();
}

init();
</script>
